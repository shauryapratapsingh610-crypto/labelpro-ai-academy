<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password | LabelPro AI</title>
<style>*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#050816;color:#fff}.card{width:420px;padding:35px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px}h1{text-align:center}p{text-align:center;color:#9ca3af;line-height:1.6}label{display:block;margin:18px 0 6px}input{width:100%;padding:14px;border:0;border-radius:10px;background:#111827;color:#fff}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:linear-gradient(90deg,#6C63FF,#00D4FF);color:#fff;font-weight:700}.bottom{text-align:center;margin-top:18px;color:#9ca3af;font-size:14px}.bottom a{color:#8b82ff;text-decoration:none}.flash{padding:10px;border-radius:8px;margin-bottom:15px;background:#14532d;text-align:center}</style></head>
<body><div class="card"><h1>🔑 Forgot Password</h1><p>Enter your account email and we'll send a reset OTP.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST"><label>Email Address</label><input type="email" name="email" required><button type="submit">Send Reset OTP</button></form>
<div class="bottom"><a href="/login">Back to Login</a></div></div></body></html>
