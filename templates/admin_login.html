<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | LabelPro AI Academy</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

    <div class="admin-container">

        <div class="admin-card">

            <div class="admin-logo">
                🤖
            </div>

            <h1>LabelPro AI</h1>

            <p class="admin-title">Administrator Portal</p>

            <p class="admin-subtitle">
                Secure access to your academy control panel
            </p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Admin Login Form -->
            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@labelpro.ai"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button type="submit">
                    Login to Admin Panel
                </button>

            </form>


            <div class="back-link">

                <a href="/">
                    ← Back to Website
                </a>

            </div>

        </div>

    </div>

</body>
</html>
