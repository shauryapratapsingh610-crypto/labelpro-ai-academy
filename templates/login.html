<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LabelPro AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#050816;
      background-image:
        radial-gradient(circle at top left,#312e81 0%,transparent 35%),
        radial-gradient(circle at bottom right,#0369a1 0%,transparent 35%);
      color:white;
    }
    .card{
      width:400px;
      padding:35px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(20px);
      border-radius:20px;
      box-shadow:0 20px 50px rgba(0,0,0,.4);
    }
    h1{text-align:center;margin-bottom:8px}
    p{text-align:center;color:#9ca3af;margin-bottom:25px}
    label{display:block;margin:14px 0 6px;font-size:14px}
    input{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:white;
      outline:none;
    }
    button{
      width:100%;
      margin-top:24px;
      padding:14px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,#6C63FF,#00D4FF);
      color:white;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }
    .bottom{
      margin-top:20px;
      text-align:center;
      color:#9ca3af;
      font-size:14px;
    }
    .bottom a{color:#6C63FF;text-decoration:none}
    .flash{
      background:#7f1d1d;
      padding:10px;
      border-radius:8px;
      margin-bottom:15px;
      text-align:center;
    }
  </style>
</head>
<body>

<div class="card">

  <h1>🔐 Welcome Back</h1>
  <p>Login to LabelPro AI Academy</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>

  </form>

  <div class="bottom">
    <a href="/forgot-password">Forgot Password?</a>
  </div>

  <div class="bottom">
    New user?
    <a href="/register">Create Account</a>
  </div>

</div>

</body>
</html>
